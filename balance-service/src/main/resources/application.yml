spring:
  application:
    name: balance-service
  
  datasource:
    url: jdbc:postgresql://balance-db:5432/balance-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

axon:
  axonserver:
    servers: axonserver:8124
  
server:
  port: 8080

logging:
  level:
    org.axonframework: INFO