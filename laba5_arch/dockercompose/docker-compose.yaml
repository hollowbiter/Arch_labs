services:
  balance-db:
    image: postgres:13.3
    container_name: balance-db-lab5
    environment:
      POSTGRES_DB: balance-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - balance-net
    volumes:
      - balance-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  axonserver:
    image: axoniq/axonserver
    container_name: axonserver-lab5
    ports:
      - "8024:8024"
      - "8124:8124"
    environment:
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: true
    networks:
      - balance-net
    volumes:
      - axon-data:/axonserver/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-lab5
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - balance-net
    restart: unless-stopped

  balance-service:
    build:
      context: ../balance-service
      dockerfile: Dockerfile
    container_name: balance-service-lab5
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://balance-db:5432/balance-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AXON_AXONSERVER_SERVERS: axonserver:8124
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8081:8080"
    networks:
      - balance-net
    depends_on:
      - balance-db
      - axonserver
      - rabbitmq
    restart: unless-stopped

networks:
  balance-net:
    driver: bridge

volumes:
  balance-db-data:
  axon-data: